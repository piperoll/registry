name: deploy
on:
  push:
    branches: [main]
    paths: ["incidents/**", "tools/**"]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild site from records
        run: |
          pip install --quiet markdown
          python3 tools/build.py
      - name: Commit rebuilt site if changed
        run: |
          git config user.name "piperoll-build"
          git config user.email "build@piperoll.org"
          git add docs/
          git diff --cached --quiet && echo "site unchanged" && exit 0
          git commit -m "build: regenerate site from records"
          git push
