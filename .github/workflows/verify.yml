name: verify
# Runs on every PR: the three jobs are required by branch protection, and a
# paths filter would deadlock any PR that does not match it (checks expected,
# never reported). They cost ~20s total; always run them.
on:
  pull_request:
    # labeled/unlabeled included so applying 'formatting-only' re-evaluates the gate
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate all records against schema enums
        run: python3 tools/validate.py

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch-grade linkcheck on changed records
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'incidents/PIR-*.md')
          if [ -z "$changed" ]; then echo "no record changes"; exit 0; fi
          status=0
          for f in $changed; do
            id=$(basename "$f" .md)
            python3 tools/linkcheck.py "$id" || status=1
          done
          exit $status

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # registered-by provenance needs full history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Site builds cleanly and docs/ is freshly rebuilt in this PR
        run: |
          pip install --quiet markdown
          python3 tools/build.py
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is stale - run 'python3 tools/build.py' and commit the result in this PR"
            exit 1
          }

  corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Modified records must add a dated correction entry (constitution rule 2)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.base_ref }}
        run: |
          case " $LABELS " in
            *" formatting-only "*) echo "formatting-only label set by an editor - gate waived"; exit 0;;
          esac
          modified=$(git diff --name-only --diff-filter=M "origin/$BASE"...HEAD -- 'incidents/PIR-*.md')
          if [ -z "$modified" ]; then echo "no existing records modified"; exit 0; fi
          status=0
          for f in $modified; do
            if git diff -U0 "origin/$BASE"...HEAD -- "$f" | grep '^+' | grep -qE '\- [0-9]{4}-[0-9]{2}-[0-9]{2}:'; then
              echo "ok    $f adds a dated correction entry"
            else
              echo "::error file=$f::modifies an existing record without adding a dated correction entry ('- YYYY-MM-DD: what changed and why') - constitution rule 2: corrections are published, never slipped"
              status=1
            fi
          done
          exit $status
